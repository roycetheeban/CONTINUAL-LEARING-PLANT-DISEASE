# Jetson Orin Nano on-device measurement -- E3/E5 upgrade from laptop proxy.
#
# Every path is RELATIVE TO THE BUNDLE ROOT (the directory containing this file).
# Nothing here reaches outside the bundle, so it can be copied to the Jetson as-is.
#
# What this replaces: the laptop-RTX-4050 proxy numbers currently in Table XIII.
# What it does NOT do: re-run the CL benchmark (Tables VI-XII). Those are method
# comparisons and are legitimately run on any GPU -- only the deployment-cost
# claims need the target device.

seed: 42

# ---------------------------------------------------------------- hardware
# FILL THESE IN BEFORE RUNNING. They are written verbatim into every metrics
# file and become the hardware provenance reported in the paper.
hardware:
  device_name: "NVIDIA Jetson Orin Nano"
  variant: "FILL ME"            # "8GB" or "4GB"
  jetpack_version: "FILL ME"    # e.g. "6.0"  (cat /etc/nv_tegra_release)
  tensorrt_version: "FILL ME"   # python3 -c "import tensorrt; print(tensorrt.__version__)"
  power_mode: "unknown"         # server access only -- nvpmodel not queried
  notes: "Server/headless access; thermal and power draw not measured."

model:
  checkpoint: models/classifier_catA_replay_cycle2.pth
  num_classes: 5
  image_size: 224
  class_names:
    - Tomato___Bacterial_spot
    - Tomato___Early_blight
    - Tomato___Late_blight
    - Tomato___Leaf_Mold
    - Tomato___healthy
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

data:
  test_dir: data/test
  capture_set_size: 8      # the paper's "8-image capture set"

export:
  onnx_path: outputs/model.onnx
  opset: 17

trt:
  engine_path: outputs/model_fp16.engine
  fp16: true
  workspace_mb: 1024
  # If the FP16 build fails, the script records WHY and exits non-zero rather
  # than silently substituting a fallback. On JetPack this should not happen.

latency:
  warmup_iters: 20
  timed_iters: 200

# --------------------------------------------------- on-device retrain cycle
# Re-runs the REAL cycle-2 replay config with identical data/hyperparams/seed,
# writing to a fresh output dir. Backs the paper's "fits the target device's
# envelope" claim, which is currently inferred rather than measured.
retrain:
  enabled: true
  output_root: outputs/retrain_cycle
  train_dir: data/cl_cycle2_stream
  replay_dir: data/replay_buffer
  val_dir: data/val
  test_dir: data/test
  input_manifest: data/replay_buffer_manifest_cycle1.json
  image_size: 224
  resize_size: 256
  batch_size: 32
  weight_decay: 0.0001
  max_epochs: 12
  min_epochs: 5
  patience: 5
  lr_g3: 0.00005
  lr_head: 0.0002
  old_per_batch: 16
  new_per_batch: 16
  add_per_class_after_cycle: 40

# ------------------------------------------------- detection / segmentation
# LATENCY ONLY. mAP / mIoU stay cited from the prior conference paper [ref21] --
# this bundle carries no detection ground truth, so accuracy is NOT re-measured.
detect_seg:
  enabled: true
  detect_weights: models/yolov8n_detect.pt
  seg_weights: models/yolov8n_seg.pt
  imgsz: 640
  warmup_iters: 10
  timed_iters: 100
  half: true
