name: AIOT
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=2.4.4
  - pandas=3.0.2
  - scipy=1.17.1
  - scikit-learn=1.8.0
  - matplotlib=3.10.9
  - seaborn=0.13.2
  - jupyterlab=4.5.6
  - notebook=7.5.5
  - ipykernel=7.2.0
  - tqdm=4.67.3
  - pyyaml=6.0.3
  - requests=2.33.1
  - pillow=12.2.0
  - pip:
      - --index-url https://download.pytorch.org/whl/cu121
      - --extra-index-url https://pypi.org/simple
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
      - torchaudio==2.5.1+cu121

# for Activate
# conda env create -f environment.yml -n NEW_NAME
# conda activate NEW_NAME
# current env: conda activate AIOT